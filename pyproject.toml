[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-path-planning-2d"
version = "1.0.0"
description = "A* and RRT path planning in occupancy grids"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
path-planning = "path_planning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
